name: Build and Deploy Site

on:
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual rebuild"
        required: false
  push:
    branches: [main]

# The site builds from a PINNED evidence tag of the source repository.
# Updating the site's content = bumping SOURCE_REF in one visible diff.
# No schedule: pinned content cannot drift, so there is nothing to poll.
env:
  SOURCE_REF: link-004

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gates:
    name: source gates must be green
    runs-on: ubuntu-latest
    steps:
      - name: clone source at pinned ref (full history for the gates)
        run: |
          git clone --branch "$SOURCE_REF" \
            https://github.com/nickjoven/proslambenomenos.git src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pyyaml
      - name: run every gate in the sealed tree
        run: cd src && python scripts/run_all.py

  build-deploy:
    name: build and deploy
    needs: gates
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: build from the pinned ref
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
